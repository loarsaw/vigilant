# docker-compose.prod.yml
#
# Production overlay: adds Caddy (automatic TLS) in front of the stack,
# tightens resource limits, disables Adminer.
#
# Works on top of EITHER base file — merges by service name, so it doesn't
# matter whether "server" comes from a `build:` or an `image:`:
#
#   Building from source:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#   Self-hosting from published images:
#     docker compose -f docker-compose.release.yml -f docker-compose.prod.yml up -d
#
# Requires DOMAIN to be set (in .env or exported in your shell) — this is
# what Caddy uses to request a TLS cert and route requests, matching the
# {$DOMAIN} placeholder in ./Caddyfile.

services:
  caddy:
    image: caddy:2-alpine
    container_name: vigilant-caddy
    restart: always
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
    logging:
      driver: json-file
      options:
        max-size: 100M

  server:
    ports: !reset []
    expose:
      - "3333"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true

  adminer:
    deploy:
      replicas: 0

volumes:
  caddy_data:
  caddy_config: